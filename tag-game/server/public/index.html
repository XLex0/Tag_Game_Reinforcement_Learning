<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Game</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0a0a0f;
            /* oscuro */
            font-family: 'Segoe UI', sans-serif;
            color: #f1f1f1;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px #1e90ff, 0 0 20px #ff0000;
        }

        .button-container {
            display: flex;
            gap: 2rem;
        }

        a button {
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(145deg, #1e90ff, #001f3f);
            box-shadow: 0 0 15px rgba(30, 144, 255, 0.6);
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        a button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.8), 0 0 40px rgba(30, 144, 255, 0.8);
        }

        .ladron {
            background: linear-gradient(145deg, #ff0000, #660000);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
    </style>
</head>

<body>
    <h1>🚨 Tag Game 🚔</h1>
    <div class="button-container">
        <a href="policiaCanva.html"><button>👮 Policía</button></a>
        <a href="ladronCanva.html"><button class="ladron">🕶️ Ladrón</button></a>
    </div>
</body>

</html>
